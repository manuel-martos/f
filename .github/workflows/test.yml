name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check shell syntax
        run: |
          for script in f.sh defs.sh install.sh; do bash -n "$script"; done
          for script in f.sh defs.sh; do zsh -n "$script"; done
      - name: Test navigation, installation, and terminal interruption
        run: python3 -m unittest discover -s tests -v
